# =============================================================================
# Frontend — local dev compose
# =============================================================================
# Run from the frontend repo root:
#   cp .env.example .env
#   docker compose up
# =============================================================================

services:
  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-v0.0.1}
        APP_COMMIT: ${APP_COMMIT:-local}
    image: ${IMAGE_NAME:-local/web}:${APP_VERSION:-v0.0.1}
    env_file: .env
    environment:
      API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-8080}:80"
