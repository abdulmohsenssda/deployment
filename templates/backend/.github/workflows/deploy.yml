# =============================================================================
# Backend CI/CD — build & push image; trigger dev auto-deploy via webhook
# =============================================================================
# Place at .github/workflows/deploy.yml in the BACKEND repo.
#
# Release tag mapping:
#   VERSION file → :vMAJOR.MINOR.PATCH (mutable; reruns overwrite the same tag)
#   any push     → :<sha>              (immutable reference for rollback/debug)
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#
# Optional (only needed for instant dev deploy; cron polling will pick it up
# within ~2 min anyway):
#   WEBHOOK_URL_DEV    e.g. https://dev.example.com:8443/deploy
#   WEBHOOK_SECRET     same value as on the deploy server
# =============================================================================

name: Build & Push Backend

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ifritah-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.version }}
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve branch
        id: branch
        run: echo "name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Validate VERSION
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be vMAJOR.MINOR.PATCH, got: $version" >&2
            exit 1
          fi
          latest="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name // empty' 2>/dev/null || true)"
          if printf '%s' "$latest" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            lowest="$(printf '%s\n%s\n' "${version#v}" "${latest#v}" | sort -V | head -n1)"
            if [ "$lowest" = "${version#v}" ] && [ "$version" != "$latest" ]; then
              echo "VERSION $version is lower than latest release $latest" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-dev-alias:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish dev alias
        env:
          SOURCE_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEV_IMAGE: ${{ env.IMAGE_NAME }}:dev
        run: docker buildx imagetools create --tag "$DEV_IMAGE" "$SOURCE_IMAGE"

  notify-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Ping dev webhook (best effort)
        env:
          URL: ${{ secrets.WEBHOOK_URL_DEV }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "No webhook configured — server cron will pull within ~2 min."
            exit 0
          fi
          curl -sfk -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d '{"type":"backend","image":"${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.tag }}"}' \
            --max-time 10 || echo "Webhook failed — falling back to cron polling."
