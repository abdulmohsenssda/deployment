# Build a reviewable backend image for same-repository pull requests.
# Fork pull requests are intentionally not given Docker Hub credentials.
name: Build PR Backend Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ifritah-api

jobs:
  build-and-push:
    # Docker Hub credentials are never exposed to fork pull requests.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve safe branch tags
        id: tags
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
            | cut -c1-100)"
          [ -n "$slug" ] || slug="branch"
          short_sha="${HEAD_SHA:0:12}"
          echo "branch_tag=pr-${slug}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=pr-${slug}-${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.branch_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.immutable_tag }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.branch_tag }}
            APP_COMMIT=${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.branch_tag }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.event.pull_request.head.repo.html_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPOSITORY: ifritah-api
    steps:
      - name: Resolve branch image tag
        id: branch_tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
            | cut -c1-100)"
          [[ -n "$slug" ]] || {
            echo "The merged PR branch does not produce a Docker tag." >&2
            exit 1
          }
          echo "tag=pr-${slug}" >> "$GITHUB_OUTPUT"

      - name: Delete branch image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BRANCH_TAG: ${{ steps.branch_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"
          : "${BRANCH_TAG:?BRANCH_TAG is required}"

          api_base="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}"
          login_payload="$(jq -cn \
            --arg identifier "$DOCKERHUB_USERNAME" \
            --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}')"
          hub_token="$(curl --fail-with-body -sS \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$login_payload" \
            'https://hub.docker.com/v2/auth/token' | jq -er '.token')"

          matches="$(mktemp)"
          trap 'rm -f "$matches"' EXIT
          page="${api_base}/tags?page_size=100&ordering=last_updated"
          while [[ -n "$page" ]]; do
            response="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer ${hub_token}" \
              "$page")"
            jq -r --arg branch "$BRANCH_TAG" '
              .results[]?.name
              | select(. == $branch or startswith($branch + "-"))
            ' <<<"$response" >>"$matches"
            page="$(jq -r '.next // empty' <<<"$response")"
          done

          sort -u "$matches" -o "$matches"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            encoded_tag="$(jq -nr --arg value "$tag" '$value | @uri')"
            curl --fail-with-body -sS \
              -X DELETE \
              -H "Authorization: Bearer ${hub_token}" \
              "${api_base}/tags/${encoded_tag}/" >/dev/null
            printf 'Deleted %s:%s\n' "$DOCKERHUB_REPOSITORY" "$tag"
          done <"$matches"
