# Production profile.
# The image is built and pushed to Docker Hub by GitHub Actions (.github/workflows/dashboard-image.yml)
# on every push to main. To update the server:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --force-recreate
#
# Required: dashboard.env with ADMIN_USER, ADMIN_PASSWORD_HASH, SESSION_KEY, BASE_DOMAIN
services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-ssdawweq/dokku-dashboard:prod}
    container_name: dokku-dashboard-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: dashboard.env
    environment:
      DASHBOARD_ENV: prod
      LISTEN: ":8080"
      DOCKER_BIN: docker
      DOKKU_CONTAINER: ${DOKKU_CONTAINER:-dokku}
      LOG_BUFFER_LINES: 5000
      LOG_DIR: /opt/dashboard-logs
      COOKIE_SECURE: "true"
      SCRIPTS_HOST_PATH: ${SCRIPTS_HOST_PATH:-/opt/deployment}
      SCRIPT_RUNNER_IMAGE: ${SCRIPT_RUNNER_IMAGE:-dokku/dokku:latest}
      DEPLOY_CONFIG_FILE: ${DEPLOY_CONFIG_FILE:-/opt/deployment/config.env}
      DEPLOYMENT_DIR: /opt/deployment
      DASHBOARD_ENV_FILE: /app/dashboard.env
      BACKUP_DIR: ${BACKUP_DIR:-/opt/tenant-backups}
      STORAGE_ROOT: ${STORAGE_ROOT:-/opt/tenant-data}
      TENANT_STATE_DIR: ${TENANT_STATE_DIR:-/opt/tenant-state}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dashboard.env:/app/dashboard.env
      - ${SCRIPTS_HOST_PATH:-/opt/deployment}:/opt/deployment:ro
      - ${BACKUP_DIR:-/opt/tenant-backups}:${BACKUP_DIR:-/opt/tenant-backups}
      - ${STORAGE_ROOT:-/opt/tenant-data}:${STORAGE_ROOT:-/opt/tenant-data}
      - ${TENANT_STATE_DIR:-/opt/tenant-state}:${TENANT_STATE_DIR:-/opt/tenant-state}
      - ${LOG_DIR:-/opt/dashboard-logs}:/opt/dashboard-logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
