# =============================================================================
# dashboard-image.yml — Build and push the Dokku Dashboard Docker image
# =============================================================================
# Triggers on every push to main so the server can update with:
#
#   docker pull ssdawweq/dokku-dashboard:latest
#   docker compose -f docker-compose.prod.yml up -d --force-recreate
#
# No Go installation or binary build step needed on the server.
# The Dockerfile uses a multi-stage build (golang:1.25-alpine builder stage)
# so the full Go compilation happens inside Docker on GitHub's runners.
#
# Tags pushed:
#   :latest          — always the most recent build from main
#   :prod            — alias for latest (used by docker-compose.prod.yml)
#   :<short-sha>     — immutable reference for rollback
#
# The binary and OCI metadata carry BUILD_VERSION plus the full commit SHA.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# =============================================================================

name: Build & Push Dashboard Image

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dokku-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: dashboard/go.sum

      - name: Verify dashboard source and embedded assets
        working-directory: dashboard
        run: go test ./...

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Compute build identity
        id: build
        run: |
          version="$(printf '%s' "${GITHUB_REF_NAME:-manual}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
            | cut -c1-64)"
          [ -n "$version" ] || version="manual"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:prod
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          build-args: |
            BUILD_VERSION=${{ steps.build.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
